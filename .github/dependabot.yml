  # Monitor Python dependencies
  - package-ecosystem: "pip"
    directory: "/SherlockWebUI-Kasm"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
    ignore:
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
